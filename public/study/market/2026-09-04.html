let loc=Object.keys(FW)[0],cur=0,drag=false;function tabs(){locTabs.innerHTML=Object.keys(FW).map(x=>`<button class="${x===loc?'a':''}" data-l="${x}">${x}</button>`).join('')}function rw(){week.innerHTML=FW[loc].map((x,i)=>`<article class="day f-${x[2]}"><div class="dd"><span class="date">${x[0]}</span><span class="wd">${i===0?'今天・':''}週${x[1]}</span></div><div class="bigico">${fi(x[2],x[3])}</div><div class="dw">${x[3]}</div><div class="temp">${x[4]}° <span class="lo">/ ${x[5]}°</span></div><div class="dmeta">☂ 降雨 ${x[6]!==''?x[6]+'%':'—'}<br>≋ 最大風速 ${x[7]!==''?x[7]+' km/h':'—'}</div><div class="stats"><div class="st">${drop()}<div class="sv">${x[8]!==''?x[8]+'%':'—'}</div><div class="sl">濕度</div></div><div class="st">${sun()}<div class="sv">${x[9]!==''?'UV '+x[9]:'—'}</div><div class="sl">UV</div></div><div class="st"><div class="pollen">${tree()}<i class="p1"></i><i class="p2"></i><i class="p3"></i></div><div class="sv">季節外</div><div class="sl">花粉</div></div></div></article>`).join('');rs();if(innerWidth<=720)week.scrollLeft=week.clientWidth*cur}function rs(){scrubTrack.innerHTML=FW[loc].map((x,i)=>`<div class="sd ${i===cur?'a':''}" data-i="${i}">${x[1]}</div>`).join('')}function setc(i,s=true){cur=Math.max(0,Math.min(6,i));[...scrubTrack.children].forEach((e,n)=>e.classList.toggle('a',n===cur));if(s&&innerWidth<=720)week.scrollTo({left:week.clientWidth*cur,behavior:drag?'auto':'smooth'})}function ix(px){let r=scrubTrack.getBoundingClientRect();return Math.round(Math.max(0,Math.min(r.width-1,px-r.left))/(r.width/6))}locTabs.onclick=e=>{let b=e.target.closest('button');if(b){loc=b.dataset.l;cur=0;tabs();rw()}};scrub.onpointerdown=e=>{if(innerWidth>720)return;drag=true;scrub.classList.add('drag');scrub.setPointerCapture(e.pointerId);setc(ix(e.clientX))};scrub.onpointermove=e=>drag&&setc(ix(e.clientX));scrub.onpointerup=e=>{drag=false;scrub.classList.remove('drag')};week.onscroll=()=>{if(innerWidth<=720&&!drag){clearTimeout(week._t);week._t=setTimeout(()=>setc(Math.round(week.scrollLeft/week.clientWidth),false),60)}};tabs();rw();
function ns(x){let e=Math.floor(Math.log10(x||1)),f=x/10**e,n=f<=1?1:f<=2?2:f<=5?5:10;return n*10**e}function geo(v){let a=Math.min(...v),b=Math.max(...v),R=b-a||1,s=ns(R/4),mn=Math.floor((a-R*.05)/s)*s,mx=Math.ceil((b+R*.05)/s)*s,pts=v.map((x,i)=>`${70+540*i/(v.length-1)},${8+188*(mx-x)/(mx-mn)}`).join(' '),g='';for(let x=mn;x<=mx;x+=s){let y=8+188*(mx-x)/(mx-mn);g+=`<line x1="70" y1="${y}" x2="610" y2="${y}" class="gr"/><text x="63" y="${y+3}" text-anchor="end" class="yl">${x.toFixed(Math.abs(x)>100?0:2)}</text>`}return{pts,g}}function card(a,p,i,t){let v=p===1?a.m:a.y,g=geo(v);return`<div class="cc"><div class="ch"><div><b>${a.name}</b><span class="last">${a.last}</span></div><span class="chg ${a.dir}">${a.dir==='up'?'▲':'▼'} ${a.day}</span></div><svg viewBox="0 0 620 220" preserveAspectRatio="none" class="sp">${g.g}<polyline points="${g.pts}" fill="none" stroke="${a.c}" stroke-width="2.4"/></svg><div class="ax"><span>${p===1?'1M':'1Y'}</span><span>2026/09</span></div><div class="tog"><button class="${p===1?'a':''}" onclick="sw('${t}',${i},1)">1 個月</button><button class="${p===2?'a':''}" onclick="sw('${t}',${i},2)">1 年</button></div></div>`}function ren(){stocks.innerHTML=S.map((x,i)=>card(x,sp[i],i,'s')).join('');fx.innerHTML=F.map((x,i)=>card(x,fp[i],i,'f')).join('')}function sw(t,i,p){(t==='s'?sp:fp)[i]=p;ren()}ren();document.querySelectorAll('.mh').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));</script></body></html>
