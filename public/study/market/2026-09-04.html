function ns(x){let e=Math.floor(Math.log10(x||1)),f=x/10**e,n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*10**e}function geo(v){let a=Math.min(...v),b=Math.max(...v),R=(b-a)||1,s=ns((R*1.1)/4),mn=Math.floor((a-R*.05)/s)*s,mx=Math.ceil((b+R*.05)/s)*s,l=70,ph=188,pts=v.map((x,i)=>`${l+540*i/Math.max(1,v.length-1)},${8+ph*(mx-x)/(mx-mn)}`).join(' '),g='';for(let x=mn;x<=mx+s*.01;x+=s){let y=8+ph*(mx-x)/(mx-mn),z=Math.max(...v.map(Math.abs)),q=z>=1000?Math.round(x).toLocaleString():z>=100?x.toFixed(1):z>=10?x.toFixed(2):x.toFixed(4);g+=`<line x1="70" y1="${y}" x2="610" y2="${y}" class="gr"/><text x="63" y="${y+3}" text-anchor="end" class="yl">${q}</text>`}return{pts,g}}function C(a,p,i,t){let v=p===1?a.m:a.y,g=geo(v);return`<div class="cc"><div class="ch"><div><b>${a.name}</b><span class="last">${a.last}</span></div><span class="chg ${a.dir}">${a.dir==='up'?'▲':'▼'} ${a.day}</span></div><svg viewBox="0 0 620 220" preserveAspectRatio="none" class="sp">${g.g}<polyline points="${g.pts}" fill="none" stroke="${a.c}" stroke-width="2.4" vector-effect="non-scaling-stroke"/></svg><div class="ax"><span>${p===1?'8月初':'2025/09'}</span><span>2026/09</span></div><div class="tog"><button class="${p===1?'a':''}" onclick="sw('${t}',${i},1)">1 個月</button><button class="${p===2?'a':''}" onclick="sw('${t}',${i},2)">1 年</button></div></div>`}function ren(){stocks.innerHTML=S.map((x,i)=>C(x,sp[i],i,'s')).join('');fx.innerHTML=F.map((x,i)=>C(x,fp[i],i,'f')).join('')}function sw(t,i,p){(t==='s'?sp:fp)[i]=p;ren()}ren();
function hr(){let p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',hour12:false}).formatToParts(new Date());return p.find(x=>x.type==='hour').value+':00'}function draw(){let hh=hr();document.querySelectorAll('.tw').forEach(w=>{w.querySelectorAll('.bg').forEach(e=>e.remove());let b=w.getBoundingClientRect();w.querySelectorAll('tbody tr').forEach(tr=>{let now=tr.querySelector('.t').textContent.startsWith(hh);tr.classList.toggle('now',now);let ty=tr.dataset.type,mm=+tr.dataset.r||0,r=tr.getBoundingClientRect(),d=document.createElement('div'),rn=ty==='rain',ht=tr.classList.contains('hot');if(!(rn||ht||now))return;d.className='bg'+(now?' now':'')+(rn?' rn':'')+(ht?' ht':'');d.style.cssText=`left:${r.left-b.left+w.scrollLeft}px;top:${r.top-b.top+w.scrollTop}px;width:${r.width}px;height:${r.height}px`;let z='';if(ht)z+='<div class="ly heat"></div>';if(rn)z+=`<div class="ly rain${mm>=4?' hr':''}"></div>`;d.innerHTML=z;w.appendChild(d)})})}draw();addEventListener('load',draw);addEventListener('resize',draw);setInterval(draw,60000);
let loc=Object.keys(FW)[0];function rt(){locTabs.innerHTML=Object.keys(FW).map(x=>`<button class="${x===loc?'a':''}" data-l="${x}">${x}</button>`).join('')}function rw(){week.innerHTML=FW[loc].map((x,i)=>`<article class="day f-${x[2]}"><div class="dd"><span class="date">${x[0]}</span><span class="wd">${i===0?'今天・':''}週${x[1]}</span></div><div class="bigico">${IC(x[2],x[3])}</div><div class="dw">${x[3]}</div><div class="temp">${x[4]}° <span class="lo">/ ${x[5]}°</span></div><div class="dmeta">☂ 降雨 ${x[6]}%<br>≋ 最大風速 ${x[7]} km/h<br>濕度 ${x[8]}% ・ UV ${x[9]}</div></article>`).join('');week.scrollLeft=0;requestAnimationFrame(updateFutureUI)}function futureStep(){const first=week.querySelector('.day');return first?first.getBoundingClientRect().width+8:week.clientWidth*.9}function futureIndex(){const step=futureStep();return Math.max(0,Math.min(FW[loc].length-1,Math.round(week.scrollLeft/Math.max(1,step))))}function updateFutureUI(){const max=Math.max(0,week.scrollWidth-week.clientWidth),trackW=futureTrack.clientWidth,ratio=week.scrollWidth?week.clientWidth/week.scrollWidth:1,thumbW=Math.max(30,trackW*Math.min(1,ratio)),travel=Math.max(0,trackW-thumbW),left=max?travel*(week.scrollLeft/max):0;futureThumb.style.width=thumbW+'px';futureThumb.style.transform=`translateX(${left}px)`;const i=futureIndex();futurePos.textContent=`${i+1} / ${FW[loc].length}`;futurePrev.disabled=week.scrollLeft<=2;futureNext.disabled=week.scrollLeft>=max-2}futurePrev.addEventListener('click',()=>week.scrollBy({left:-futureStep(),behavior:'smooth'}));futureNext.addEventListener('click',()=>week.scrollBy({left:futureStep(),behavior:'smooth'}));week.addEventListener('scroll',updateFutureUI,{passive:true});addEventListener('resize',updateFutureUI);let dragging=false,dragStartX=0,dragStartScroll=0;futureThumb.addEventListener('pointerdown',e=>{dragging=true;dragStartX=e.clientX;dragStartScroll=week.scrollLeft;futureThumb.classList.add('dragging');futureThumb.setPointerCapture(e.pointerId)});futureThumb.addEventListener('pointermove',e=>{if(!dragging)return;const max=Math.max(0,week.scrollWidth-week.clientWidth),trackW=futureTrack.clientWidth,thumbW=futureThumb.getBoundingClientRect().width,travel=Math.max(1,trackW-thumbW);week.scrollLeft=Math.max(0,Math.min(max,dragStartScroll+(e.clientX-dragStartX)*(max/travel)))});function endDrag(e){if(!dragging)return;dragging=false;futureThumb.classList.remove('dragging');try{futureThumb.releasePointerCapture(e.pointerId)}catch(_e){}}futureThumb.addEventListener('pointerup',endDrag);futureThumb.addEventListener('pointercancel',endDrag);futureTrack.addEventListener('pointerdown',e=>{if(e.target===futureThumb)return;const r=futureTrack.getBoundingClientRect(),max=Math.max(0,week.scrollWidth-week.clientWidth),thumbW=futureThumb.getBoundingClientRect().width,travel=Math.max(1,r.width-thumbW),x=Math.max(0,Math.min(travel,e.clientX-r.left-thumbW/2));week.scrollTo({left:max*(x/travel),behavior:'smooth'})});locTabs.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;loc=b.dataset.l;rt();rw()});rt();rw();document.querySelectorAll('.mod').forEach(m=>{let h=m.querySelector('.mh');if(h)h.addEventListener('click',()=>{m.classList.toggle('open');if(m.id==='m1')setTimeout(draw,50);if(m.id==='m2')setTimeout(updateFutureUI,240)});let f=m.querySelector('.foldBtn');if(f)f.addEventListener('click',()=>m.classList.remove('open'))});
</script></body></html>
