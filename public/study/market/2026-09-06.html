6h24a8 8 0 0 0 0-16 12 12 0 0 0-22-3A9 9 0 0 0 13 26z" fill="#d8e5f6" stroke="#51647a" stroke-width="3"/><path d="M26 27l-6 9h5l-3 8 10-12h-5l3-5z" fill="#facc15"/></svg>`,drop=()=>`<svg viewBox="0 0 48 48"><path d="M24 5S12 20 12 29a12 12 0 0 0 24 0C36 20 24 5 24 5z" fill="#cdeafe" stroke="#2586c7" stroke-width="3"/></svg>`,tree=()=>`<svg viewBox="0 0 48 48"><path d="M24 5L12 20h7L9 31h11v10h8V31h11L29 20h7z" fill="#dcefdc" stroke="#2f7d4a" stroke-width="3"/></svg>`;let loc=Object.keys(D.FW)[0],cur=0,drag=false;function fi(k,t){return /雷/.test(t)?storm():k==='rain'?rain():k==='sun'?sun():cloud()}function tabsR(){tabs.innerHTML=Object.keys(D.FW).map(x=>`<button class="${x===loc?'a':''}" data-l="${x}">${x}</button>`).join('')}function scrubR(){track.innerHTML=D.FW[loc].map((x,i)=>`<div class="sd ${i===cur?'a':''}" data-i="${i}">${x[1]}</div>`).join('')}function weekR(){week.innerHTML=D.FW[loc].map((x,i)=>`<article class="day ${x[2]}"><div class="dd"><span>${x[0]}</span><span>${i===0?'今天・':''}週${x[1]}</span></div><div class="big">${fi(x[2],x[3])}</div><b>${x[3]}</b><div class="temp">${x[4]}° <small>/ ${x[5]}°</small></div><div class="meta">☂ 降雨 ${x[6]}%<br>≋ 最大風速 ${x[7]} km/h</div><div class="stats"><div class="st">${drop()}<div class="sv">${x[8]}%</div>濕度</div><div class="st">${sun()}<div class="sv">UV ${x[9]}</div>UV</div><div class="st">${tree()}<div class="sv">${x[10]}</div>花粉</div></div></article>`).join('');scrubR();if(innerWidth<=720)week.scrollLeft=week.clientWidth*cur}function setCur(i,scroll=true){cur=Math.max(0,Math.min(6,i));[...track.children].forEach((e,n)=>e.classList.toggle('a',n===cur));if(scroll&&innerWidth<=720)week.scrollTo({left:week.clientWidth*cur,behavior:drag?'auto':'smooth'})}tabs.onclick=e=>{let b=e.target.closest('button');if(b){loc=b.dataset.l;cur=0;tabsR();weekR()}};scrub.onpointerdown=e=>{if(innerWidth>720)return;drag=true;scrub.classList.add('drag');scrub.setPointerCapture(e.pointerId);let r=track.getBoundingClientRect();setCur(Math.round(Math.max(0,Math.min(r.width,e.clientX-r.left))/r.width*6))};scrub.onpointermove=e=>{if(drag){let r=track.getBoundingClientRect();setCur(Math.round(Math.max(0,Math.min(r.width,e.clientX-r.left))/r.width*6))}};scrub.onpointerup=()=>{drag=false;scrub.classList.remove('drag')};week.onscroll=()=>{if(innerWidth<=720&&!drag){clearTimeout(week._);week._=setTimeout(()=>setCur(Math.round(week.scrollLeft/week.clientWidth),false),80)}};tabsR();weekR();let period={};function pts(v){let a=Math.min(...v),b=Math.max(...v),r=b-a||1;return v.map((x,i)=>`${10+590*i/(v.length-1)},${10+120*(b-x)/r}`).join(' ')}function market(arr,id){document.getElementById(id).innerHTML=arr.map((x,i)=>{let p=period[id+i]||'a',v=x[p];return`<div class="cc"><div class="ch"><div><b>${x.n}</b><span class="last">${x.v}</span></div><span class="chg ${x.d[0]=='-'?'down':'up'}">${x.d}</span></div><svg class="spark" viewBox="0 0 610 140" preserveAspectRatio="none"><polyline points="${pts(v)}" fill="none" stroke="#2563eb" stroke-width="2.4"/></svg><div class="tog"><button class="${p==='a'?'a':''}" onclick="sw('${id}',${i},'a')">1 個月</button><button class="${p==='y'?'a':''}" onclick="sw('${id}',${i},'y')">1 年</button></div></div>`}).join('')}function sw(id,i,p){period[id+i]=p;market(id==='stocks'?D.S:D.F,id)}market(D.S,'stocks');market(D.F,'fx');document.querySelectorAll('.mh').forEach(h=>h.onclick=()=>{h.closest('.mod').classList.toggle('open');setTimeout(drawWeatherEffects,30)});</script></body></html>
